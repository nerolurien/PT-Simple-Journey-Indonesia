name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-lint-and-test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simple_journey_helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Verify Formatting (gofmt)
        working-directory: backend
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "The following files are not formatted with gofmt -s:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run Go Vet
        working-directory: backend
        run: go vet ./...

      - name: Run Go Tests with Race Detector
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: simple_journey_helpdesk
          DB_SSLMODE: disable
          JWT_SECRET: testsecretkey123456789012345678901234
        run: go test -v -race ./...

  frontend-lint-and-build:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Production Build
        working-directory: frontend
        run: npm run build
